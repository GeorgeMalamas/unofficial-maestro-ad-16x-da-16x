name: Build 64ch SIP-Off PKG Installer

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

concurrency:
  group: build-64ch-pkg
  cancel-in-progress: true

jobs:
  build-pkg:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26-intel, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build 64ch SIP-Off PKG Installer
        run: |
          sw_vers
          xcodebuild -version
          xcrun --sdk driverkit --show-sdk-path
          xcrun --sdk driverkit --show-sdk-version
          bash -x Installer/build-sip-off-pkg.sh

      - name: Upload PKG Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UnofficialSymphonyMaestro-64ch-SIP-Off-PKG-${{ matrix.os }}
          path: Installer/build/output/*.pkg
